[project]
name = "voice-dictation"
version = "0.1.0"
description = "Offline voice-to-text dictation tool with global hotkey activation"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pynput>=1.7.6",
    "pystray>=0.19.4",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "tomli>=2.0.0;python_version<'3.11'",
    "loguru>=0.7.0",
    "pywin32>=306;sys_platform=='win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-timeout>=2.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
voice-dictation = "voice_dictation.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_dictation"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=voice_dictation --cov-report=term-missing"
markers = [
    "macos: test requires macOS",
    "windows: test requires Windows",
    "integration: integration test",
    "system: system/E2E test requiring real hardware",
    "performance: performance benchmark test",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
